<vo-lib-page [contentLoading]="loading" header="CONTEST.TITLE">
  @if (canCreate) {
    <div class="buttons">
      @if (canAddPoliticalAssembly) {
        <bc-button
          variant="tertiary"
          icon="plus"
          label="{{ 'POLITICAL_ASSEMBLY.NEW' | translate }}"
          (buttonClick)="createPoliticalAssembly()"
        ></bc-button>
      }
      <bc-button variant="tertiary" icon="plus" label="{{ 'CONTEST.NEW' | translate }}" (buttonClick)="create()"></bc-button>
      <bc-button
        variant="tertiary"
        icon="download"
        label="{{ 'IMPORT.IMPORT_CONTEST' | translate }}"
        (buttonClick)="import()"
      ></bc-button>
    </div>
  }
  <app-contest-list
    (create)="create($event.date)"
    (edit)="edit($event)"
    (delete)="delete($event)"
    (view)="view($event.id)"
    (export)="export($event.id, $event.eVoting)"
    [contests]="contests"
    [showEndOfTestingPhase]="true"
    [showType]="canAddPoliticalAssembly"
    [canCreate]="canCreate"
    [canEdit]="canEdit"
    [canDelete]="canDelete"
    [politicalAssemblies]="politicalAssemblies"
    [showPaginator]="true"
    tableName="contest-overview-active"
    >
  </app-contest-list>

  <h2 translate>CONTEST.PAST_CONTESTS</h2>
  <app-contest-list
    (archive)="archive($event)"
    (pastUnlock)="pastUnlock($event)"
    (edit)="edit($event)"
    (view)="view($event.id)"
    (export)="export($event.id, $event.eVoting)"
    [showArchivePer]="true"
    [contests]="pastContests"
    [canCreate]="canCreate"
    [canEdit]="canEdit"
    [canDelete]="false"
    [showType]="canAddPoliticalAssembly"
    [showPaginator]="true"
    [politicalAssemblies]="pastPoliticalAssemblies"
    [dateSortDirection]="'desc'"
    tableName="contest-overview-past"
  ></app-contest-list>

  <h2 translate>CONTEST.ARCHIVED_CONTESTS</h2>
  <app-contest-list
    class="mb-4 block"
    (view)="view($event.id)"
    (export)="export($event.id, $event.eVoting)"
    [showPaginator]="true"
    [contests]="archivedContests"
    [canCreate]="canCreate"
    [canEdit]="canEdit"
    [canDelete]="false"
    [showType]="canAddPoliticalAssembly"
    [showState]="false"
    [politicalAssemblies]="archivedPoliticalAssemblies"
    [dateSortDirection]="'desc'"
    tableName="contest-overview-archived"
  ></app-contest-list>
</vo-lib-page>
