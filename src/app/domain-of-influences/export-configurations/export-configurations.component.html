@for (config of configurations || []; track config; let index = $index) {
  <bc-text
    [label]="'DOMAIN_OF_INFLUENCE.AUSMITTLUNG.EXPORT_CONFIGURATION.DESCRIPTION' | translate"
    [required]="true"
    [readonly]="readonly"
    [(value)]="config.description"
    [subscriptSizing]="'dynamic'"
  ></bc-text>
  <bc-text
    [label]="'DOMAIN_OF_INFLUENCE.AUSMITTLUNG.EXPORT_CONFIGURATION.EAI_MESSAGE_TYPE' | translate"
    [required]="true"
    [readonly]="readonly"
    [(value)]="config.eaiMessageType"
    [subscriptSizing]="'dynamic'"
  ></bc-text>
  <bc-dropdown
    [label]="'DOMAIN_OF_INFLUENCE.AUSMITTLUNG.EXPORT_CONFIGURATION.PROVIDER' | translate"
    [items]="providers"
    displayExpr="description"
    valueExpr="value"
    [required]="true"
    [readonly]="readonly"
    [(value)]="config.provider"
    [subscriptSizing]="'dynamic'"
  ></bc-dropdown>
  @if (!readonly) {
    <bc-button
      variant="tertiary"
      icon="plus"
      class="pt-3"
      [label]="'DOMAIN_OF_INFLUENCE.AUSMITTLUNG.EXPORT_CONFIGURATION.ASSIGN_OPEN' | translate"
      (buttonClick)="assign(config)"
    ></bc-button>
  } @else {
    <div></div>
  }
  @if (!readonly) {
    <bc-icon icon="trash" iconColor="error" class="pt-2 clickable" (click)="remove(index)"></bc-icon>
  } @else {
    <div></div>
  }
}
@if (readonly) {
  <p class="no-data">{{ 'DOMAIN_OF_INFLUENCE.AUSMITTLUNG.EXPORT_CONFIGURATION.NO_DATA' | translate }}</p>
}
@if (!readonly) {
  <bc-button
    variant="tertiary"
    icon="plus"
    [label]="'DOMAIN_OF_INFLUENCE.AUSMITTLUNG.EXPORT_CONFIGURATION.ADD' | translate"
    (buttonClick)="add()"
  ></bc-button>
}
