<vo-lib-dialog
  [contentLoading]="fileSelect.loading"
  [header]="'IMPORT.IMPORT_MAJORITY_ELECTION_CANDIDATES.TITLE' | translate"
  (dialogClose)="cancel()"
>
  <bc-simple-stepper #stepper
                     content
                     labelPosition="bottom"
                     linear
                     (selectionChange)="stepChange($event)">
    <bc-simple-step #step1 [label]="'IMPORT.FILE' | translate" [status]="stepper.index === 0 ? 'progress' : 'complete'">
      <app-import-file-select
        content
        #fileSelect
        [importTypes]="importTypes"
        (importsChange)="importFilesChanged($event)"
      ></app-import-file-select>
    </bc-simple-step>
    <bc-simple-step
      [label]="'IMPORT.IMPORT_MAJORITY_ELECTION_CANDIDATES.CANDIDATE_STEP' | translate"
      [disabled]="!lastStep"
      [status]="lastStep ? 'progress' : 'open'"
    >
        <app-majority-election-candidate-list
          [candidates]="candidates"
          [hideActionButtons]="true"
          (candidatesReordered)="reorderCandidates($event)"
          class="mb-2">
        </app-majority-election-candidate-list>
    </bc-simple-step>
  </bc-simple-stepper>

  <vo-lib-button-bar footer
                     [saveLabel]="(lastStep ? 'IMPORT.IMPORT_MAJORITY_ELECTION_CANDIDATES.TITLE' : 'APP.NEXT') | translate"
                     (save)="lastStep ? save() : stepper.next()"
                     [canSave]="canSave"
                     [saving]="saving"
                     [cancelLabel]="'APP.CANCEL' | translate"
                     (cancel)="cancel()"></vo-lib-button-bar>
</vo-lib-dialog>
