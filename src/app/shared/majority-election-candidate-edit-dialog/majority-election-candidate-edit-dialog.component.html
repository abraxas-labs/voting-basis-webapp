<vo-lib-dialog
  [header]="!isNew ? ('MAJORITY_ELECTION.CANDIDATE.EDIT' | translate) : ('MAJORITY_ELECTION.CANDIDATE.NEW' | translate)"
  (dialogClose)="closeWithUnsavedChangesCheck()"
>
^
  <app-majority-election-candidate-edit
    content
    [candidate]="data"
    [testingPhaseEnded]="testingPhaseEnded"
    [isCandidateLocalityRequired]="isCandidateLocalityRequired"
    [isCandidateOriginRequired]="isCandidateOriginRequired"
    [hideOccupationTitle]="hideOccupationTitle"
    [enableAdditionalCandidateFields]="enableAdditionalCandidateFields"
    (contentChanged)="contentChanged()"
    [parties]="parties"
    [individualCandidatesDisabled]="individualCandidatesDisabled">
  </app-majority-election-candidate-edit>

  <vo-lib-button-bar footer
                  [canSave]="canSave"
                  [saving]="saving"
                  [sticky]="false"
                  (save)="save()"
                  (cancel)="closeWithUnsavedChangesCheck()"></vo-lib-button-bar>
</vo-lib-dialog>
